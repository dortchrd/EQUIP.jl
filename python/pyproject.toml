[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "voxelfit"
version = "0.1.0"
description = "Fast voxel-wise nonlinear least-squares fitting of MRI data (Python front end for VoxelFit.jl)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "juliacall>=0.9.20"]

[tool.setuptools]
packages = ["voxelfit"]

[tool.setuptools.package-data]
voxelfit = ["juliapkg.json"]
