Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

# EQUIP itself, from this repository: so that `julia --project=test test/runtests.jl` runs the
# tests directly (Pkg.test adds the package being tested anyway).
[sources]
EQUIP = {path = ".."}

# While testing, EQUIP is built without its precompile workload (src/precompile.jl): a code change
# then costs seconds to rebuild, not a minute. Everything still compiles where the tests first use
# it. Set here, in the test environment, so nothing needs remembering; CI turns the workload back
# on (.github/workflows/CI.yml writes a test/LocalPreferences.toml, which takes precedence), so CI
# tests EQUIP as users install it.
[preferences.EQUIP]
precompile_workload = false
